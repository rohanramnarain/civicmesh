[project]
name = "civicmesh-api"
version = "0.1.0"
description = "CivicGrid NYC API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "fastembed>=0.3.4",
  "numpy>=1.26.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "duckdb>=1.0.0",
  "qdrant-client>=1.10.0",
  "redis>=5.0.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "lightgbm>=4.5.0",
  "firebase-admin>=7.5.0",
]

[dependency-groups]
dev = [
  "ruff>=0.5.0",
  "pytest>=8.2.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
